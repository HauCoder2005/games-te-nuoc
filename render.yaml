services:
  - type: web
    name: aqua-blast-server
    runtime: docker
    dockerfilePath: ./infra/server.Dockerfile
    region: singapore
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "2567"
      - key: ALLOWED_ORIGIN
        value: "*"
