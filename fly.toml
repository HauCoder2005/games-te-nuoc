app = "aqua-blast-api"
primary_region = "sin"

[build]
  dockerfile = "infra/server.Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "2567"
  ALLOWED_ORIGIN = "*"

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
